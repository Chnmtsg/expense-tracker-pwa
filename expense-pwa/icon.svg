<!-- The "any" icon: rounded square, drawn edge to edge.

     The tugrik mark is built from rectangles rather than set as <text>. An
     installed icon is rasterised by the OS, outside this app's stylesheet and
     often outside a browser, so a font-family stack is a request the renderer
     may not honour — and when "system-ui" resolves to something without ₮ the
     icon shows a fallback box. Geometry always renders.

     The word "tracker" is gone. At 48px it was unreadable, and the OS prints
     the app name beside the icon anyway. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tugrik tracker">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <g fill="#fff">
    <!-- T: crossbar and stem -->
    <rect x="106" y="126" width="300" height="52" rx="10"/>
    <rect x="230" y="126" width="52" height="260" rx="10"/>
    <!-- the two strokes that make it a tugrik sign, not a T -->
    <rect x="146" y="212" width="220" height="34" rx="8"/>
    <rect x="146" y="272" width="220" height="34" rx="8"/>
  </g>
</svg>
