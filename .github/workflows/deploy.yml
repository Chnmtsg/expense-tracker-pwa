# Publish the application to GitHub Pages.
#
# WHAT IS PUBLISHED: expense-pwa/ ONLY, and it is published at the site root.
# Not the repository root. That is deliberate on both halves.
#
#   * The repo root carries reports/, knowledge/, tools/ and CLAUDE.md — the
#     review history and the engineering process. None of it is secret, but
#     none of it belongs on the URL a user opens either.
#   * Uploading expense-pwa/ as the artifact means index.html lands at the top
#     of the site, so the address is <user>.github.io/<repo>/ rather than
#     <user>.github.io/<repo>/expense-pwa/index.html.
#
# The application has no build step. It is files, and it opens from disk. This
# workflow copies them; it does not compile anything, and it must never start.
#
# VERIFY RUNS BEFORE DEPLOY, and a failure stops the publish. Only the four
# static predicates run here — lint, escaping, contrast and save-outcome —
# because those need nothing but Node. The render harness (v1, boot, recurrence,
# debts) needs a real Chrome and a real viewport; it stays a local command, and
# a green run here does NOT mean those passed. Do not add them without also
# proving they can fail in this environment.

name: Deploy

# MANUAL ONLY, AND THAT IS THE POINT. This used to also carry
# `push: branches: [main]`, which made every commit that reached main a publish
# to installed users.
#
# The derivation, not a preference. `sw.js` carries a hand-maintained cache key
# and the standing rule is one bump per deploy. A push trigger makes "a deploy"
# mean "a commit", and nobody can bump a hand-maintained string once per commit —
# so the rule became unfollowable, and a rule that cannot be followed stops being
# read. Worse, it would publish every intermediate commit of a sprint to an
# offline-first application whose users get the new build on their next load.
#
# So a publish is a deliberate act: Actions → Deploy → Run workflow. Bump the
# cache key first; see sw.js:1.
#
# The verify gate below is untouched and still refuses to publish a red tree.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Not cancel-in-progress: a half-finished Pages deploy
# that is cancelled can leave the live site on a partial upload, and this is
# the copy people actually open.
concurrency:
  group: pages
  cancel-in-progress: false

# Action majors are the first to run on Node 24 (GitHub retired the Node 20
# runtime for actions), and the runner is pinned rather than ubuntu-latest, so
# an image migration is a change made here on purpose rather than one that
# arrives on a publish day. Both jobs need only Node and git.
jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The version the local harness runs on.
          node-version: 24
      # `npm ci` needs a lockfile and this project deliberately gitignores one
      # — eslint is the single dev dependency and the app ships none.
      - run: npm install --no-audit --no-fund
      - run: npm run verify

  deploy:
    needs: verify
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: expense-pwa
      - id: deployment
        uses: actions/deploy-pages@v5
